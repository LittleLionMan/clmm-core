[workspace]
resolver = "2"
members = ["crates/clmm-state"]

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
raydium-clmm = { git = "https://github.com/raydium-io/raydium-clmm", rev = "ed1eb41519d5355755f7df52b43fa9610938b60b", features = ["no-entrypoint", "client"] }
anchor-lang = "=1.0.2"
bytemuck = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
